server {
    listen 80;
    listen [::]:80;
    server_name khodrochare.ir www.khodrochare.ir;
    server_tokens off;
    return 301 https://khodrochare.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.khodrochare.ir;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/khodrochare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khodrochare.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://khodrochare.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name khodrochare.ir;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/khodrochare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khodrochare.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
    }
}
