# Cache policy per path prefix, applied once in `location /` below.
#
# Why this exists: the origin used to answer HTML documents with
# `Cache-Control: s-maxage=31536000` (one year). If Cloudflare ever starts caching
# those responses, a bad render — a 404 carrying the homepage metadata, a page with an
# empty section — would stay on the edge for twelve months. HTML is therefore kept
# fresh while hashed build output and media keep their long cache.
# See docs/seo-audit-live-2026-09-06.md, finding P1-6.
map $uri $khodrochare_cache_control {
    default                                 "public, max-age=0, must-revalidate, s-maxage=60, stale-while-revalidate=600";
    ~^/_next/static/                        "public, max-age=31536000, immutable";
    ~^/(images|icons|fonts)/                "public, max-age=31536000, immutable";
    ~^/(robots\.txt|sitemap\.xml)$          "public, max-age=3600";
    ~^/api/                                 "no-store";
}

server {
    listen 80;
    listen [::]:80;
    server_name khodrochare.ir www.khodrochare.ir;
    server_tokens off;
    # One hop straight to the apex over HTTPS: www must not be redirected twice
    # (http://www -> https://www -> https://apex). Cloudflare's "Always Use HTTPS"
    # adds an edge hop of its own, so pair this with a Cloudflare Redirect Rule that
    # sends www.khodrochare.ir/* to https://khodrochare.ir/* (finding P2-12).
    return 301 https://khodrochare.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.khodrochare.ir;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/khodrochare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khodrochare.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://khodrochare.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name khodrochare.ir;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/khodrochare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khodrochare.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;

        # Replace whatever the origin sends with the per-prefix policy from the map,
        # so exactly one Cache-Control header reaches Cloudflare.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $khodrochare_cache_control always;
    }
}
